name: scheduled-extraction

on:
  schedule:
    # Runs at 02:00 UTC on the 1st of January and July (every 6 months)
    - cron: "0 2 1 1,7 *"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year (default: 2015)"
        required: false
        default: "2015"
      max_per_query:
        description: "Max articles per query (0 = unlimited, 50 for smoke test)"
        required: false
        default: "0"
      dry_run:
        description: "Skip push to outputs repo (type true or false)"
        required: false
        default: "false"
      allow_partial:
        description: "Publish even if some disciplines are missing or below the row-count sanity threshold (type true or false)"
        required: false
        default: "false"

jobs:
  extract:
    name: Extract — ${{ matrix.discipline }}
    runs-on: ubuntu-latest
    timeout-minutes: 600
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        discipline: [stroke, neuroscience, neurology, cardiology]
      # OpenAlex metered pricing: one API key gets $1/day (10,000 list requests), resetting at
      # 00:00 UTC. Running disciplines concurrently makes them compete for the same budget, so
      # run them one at a time; the pipeline sleeps through budget resets and resumes.
      max-parallel: 1
      fail-fast: false

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Completed retrieval slices are cached across runs so a job that times out or stops at the
      # budget cap resumes where it left off. The key is unique per run (actions/cache never
      # overwrites an existing key); restore-keys picks the most recent cache for the same
      # discipline/start_year/max_per_query. Saved with if: always() so failed runs resume too.
      # The "v2" schema tag: slices now carry the OpenAlex work-metadata columns (work_type,
      # oa_status, locations, countries, funders) captured at retrieval, so older v1 slices
      # are not restored and no --backfill-openalex-metadata pass is needed for new runs.
      - name: Restore cached retrieval slices
        id: restore-slices
        uses: actions/cache/restore@v5
        with:
          path: data/benchmarks/${{ matrix.discipline }}/retrieval_slices
          key: retrieval-slices-v2-${{ matrix.discipline }}-${{ github.event.inputs.start_year || '2015' }}-mpq${{ github.event.inputs.max_per_query || '0' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            retrieval-slices-v2-${{ matrix.discipline }}-${{ github.event.inputs.start_year || '2015' }}-mpq${{ github.event.inputs.max_per_query || '0' }}-

      - name: Write .env from secrets
        run: |
          cat > .env <<'ENVEOF'
          OPENALEX_MAILTO=${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY=${{ secrets.OPENALEX_API_KEY }}
          UNPAYWALL_EMAIL=${{ secrets.UNPAYWALL_EMAIL }}
          LLM_PROVIDER=openai
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_LLM_MODEL=gpt-4o-mini
          ENVEOF

      - name: Run extraction for ${{ matrix.discipline }}
        env:
          MAX_PER_QUERY: ${{ github.event.inputs.max_per_query || '0' }}
          START_YEAR: ${{ github.event.inputs.start_year || '2015' }}
        run: |
          # Hosted runners cap a job at 6 h, so a budget wait longer than 5 h cannot finish here:
          # stop the slice cleanly (partial saved, cache kept) and let the next run resume instead.
          # The data-availability-statement audit samples 1,500 open-access full texts per year
          # from Europe PMC (free, no key; resumable via das_cache.jsonl).
          ARGS="--disciplines ${{ matrix.discipline }} --start-year $START_YEAR --skip-dashboard --disable-dataset-search --openalex-budget-wait-max-hours 5 --das-audit-sample-per-year 1500"
          if [ "$MAX_PER_QUERY" != "0" ]; then
            # Smoke test: the later --das-audit-sample-per-year wins (argparse), keeping the audit tiny.
            ARGS="$ARGS --max-per-query $MAX_PER_QUERY --disable-api-enrich --das-audit-sample-per-year 20"
          fi
          python scripts/run_discipline_benchmark.py $ARGS

      - name: Save retrieval slices to cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/benchmarks/${{ matrix.discipline }}/retrieval_slices
          key: ${{ steps.restore-slices.outputs.cache-primary-key }}

      - name: Upload discipline output
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.discipline }}
          path: |
            data/benchmarks/${{ matrix.discipline }}/
            !data/benchmarks/${{ matrix.discipline }}/retrieval_slices/
          if-no-files-found: warn
          retention-days: 3

  dashboard-and-push:
    name: Dashboard and push
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all discipline outputs
        uses: actions/download-artifact@v4
        with:
          pattern: output-*
          path: data/benchmarks/
          merge-multiple: false

      - name: Reorganize downloaded artifacts into discipline directories
        run: |
          echo "=== Contents of data/benchmarks/ after download ==="
          find data/benchmarks/ -maxdepth 2 -type d || echo "(nothing found)"
          for discipline in stroke neuroscience neurology cardiology; do
            src="data/benchmarks/output-${discipline}"
            dst="data/benchmarks/${discipline}"
            if [ -d "$src" ]; then
              mv "$src" "$dst"
              echo "Moved $src -> $dst"
            else
              echo "No artifact found for $discipline (skipping)"
            fi
          done

      - name: Build dashboard
        run: |
          INPUTS=""
          for discipline in stroke neuroscience neurology cardiology; do
            csv="data/benchmarks/$discipline/fully_enriched.csv"
            if [ -f "$csv" ]; then
              INPUTS="$INPUTS $discipline=$csv"
            fi
          done
          if [ -n "$INPUTS" ]; then
            python scripts/build_discipline_dashboard.py \
              --inputs $INPUTS \
              --out-dir data/benchmarks/dashboard
          else
            echo "No fully_enriched.csv files found; skipping dashboard."
          fi

      - name: Prepare outputs archive manifest
        run: python scripts/prepare_outputs_archive.py

      - name: Upload combined outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-outputs-${{ github.run_id }}
          path: |
            data/benchmarks/
            !data/benchmarks/*/retrieval_slices/
            outputs_archive/
          retention-days: 30
          if-no-files-found: warn

      # Gate: never publish partial results. Every discipline must have a fully_enriched.csv with
      # more than MIN_ROWS data rows unless allow_partial=true. In dry_run mode this only warns.
      - name: Verify all discipline outputs are complete
        if: ${{ github.event.inputs.allow_partial != 'true' }}
        env:
          MIN_ROWS: "50000"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python - <<'PYEOF'
          import csv, os, sys
          from pathlib import Path

          csv.field_size_limit(sys.maxsize)
          min_rows = int(os.environ["MIN_ROWS"])
          dry_run = os.environ.get("DRY_RUN", "false").lower() == "true"
          problems = []
          for discipline in ["stroke", "neuroscience", "neurology", "cardiology"]:
              path = Path("data/benchmarks") / discipline / "fully_enriched.csv"
              if not path.is_file():
                  problems.append(f"{discipline}: {path} is missing")
                  continue
              with path.open("r", encoding="utf-8", errors="ignore", newline="") as fh:
                  rows = sum(1 for _ in csv.reader(fh)) - 1
              status = "ok" if rows > min_rows else "TOO FEW"
              print(f"{discipline}: {rows} data rows ({status}, threshold {min_rows})")
              if rows <= min_rows:
                  problems.append(f"{discipline}: only {rows} rows (threshold {min_rows})")
          if problems:
              print("::error::Incomplete benchmark outputs; refusing to publish:")
              for problem in problems:
                  print(f"  - {problem}")
              print("Re-run the workflow (cached retrieval slices resume) or set allow_partial=true to override.")
              if dry_run:
                  print("dry_run=true: not failing the job (nothing will be published).")
              else:
                  sys.exit(1)
          PYEOF

      - name: Checkout outputs repo
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v5
        with:
          repository: Friseeb/stroke_open_science_outputs
          token: ${{ secrets.OUTPUTS_REPO_PAT }}
          path: outputs_repo

      - name: Upload fully_enriched CSVs to GitHub Release and copy summary files to git
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.OUTPUTS_REPO_PAT }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H%M%SZ")
          TAG="run-${TIMESTAMP}"

          # Upload fully_enriched.csv (250-315 MB each) as release assets.
          # GitHub requires unique asset names within a release, so each file
          # is copied to a discipline-prefixed name before uploading.
          ASSETS=()
          for discipline in stroke neuroscience neurology cardiology; do
            csv="data/benchmarks/$discipline/fully_enriched.csv"
            if [ -f "$csv" ]; then
              dest="/tmp/${discipline}-fully_enriched.csv"
              cp "$csv" "$dest"
              ASSETS+=("$dest")
            fi
          done

          if [ ${#ASSETS[@]} -gt 0 ]; then
            gh release create "$TAG" \
              --repo "Friseeb/stroke_open_science_outputs" \
              --title "Benchmark Run ${TIMESTAMP}" \
              --notes "Full enriched datasets for all disciplines are attached as release assets (e.g. stroke-fully_enriched.csv). The git commit contains high-impact subsets and dashboard." \
              "${ASSETS[@]}"
            echo "Release created: $TAG"
          fi

          # Copy only the files that fit in git (<100 MB each)
          DEST="outputs_repo/runs/${TIMESTAMP}"
          mkdir -p "$DEST"
          rsync -a \
            --exclude='retrieval_slices/' \
            --exclude='raw_openalex_articles.csv' \
            --exclude='enriched_preview.csv' \
            --exclude='enrich_cache.json' \
            --exclude='llm_cache.json' \
            --exclude='openalex_metadata_cache.jsonl' \
            --exclude='das_cache.jsonl' \
            --exclude='fully_enriched.csv' \
            data/benchmarks/. "$DEST/"
          cp outputs_archive/manifest.csv "$DEST/manifest.csv" 2>/dev/null || true
          cp outputs_archive/metadata.json "$DEST/metadata.json" 2>/dev/null || true
          echo "$TIMESTAMP" > outputs_repo/LATEST_RUN.txt

          # Update GitHub Pages root so the dashboard is always at the repo's Pages URL
          if [ -f "data/benchmarks/dashboard/discipline_dashboard.html" ]; then
            mkdir -p outputs_repo/docs
            cp data/benchmarks/dashboard/discipline_dashboard.html outputs_repo/docs/index.html
            cp data/benchmarks/dashboard/discipline_overall_summary.csv outputs_repo/docs/ 2>/dev/null || true
            cp data/benchmarks/dashboard/discipline_year_summary.csv outputs_repo/docs/ 2>/dev/null || true
          fi

      - name: Commit and push to outputs repo
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cd outputs_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -A
          if git diff --cached --quiet; then
            echo "No new outputs to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H%M%SZ")
            git commit -m "chore: automated benchmark run ${TIMESTAMP}"
            git push
          fi
